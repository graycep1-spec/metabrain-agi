name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-compose-smoke:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: metabrain_test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metabrain_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/metabrain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit and scaffold tests
        run: python -m pytest -q
      - name: Configure local smoke environment
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose config -q
      - name: Start services and verify health
        run: |
          docker compose up --detach --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8081/healthz
      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
