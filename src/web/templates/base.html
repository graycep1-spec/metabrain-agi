<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MetaBrain — кабинет{% endblock %}</title>
  <style>
    :root {
      --bg: #eef1f6; --card: #ffffff; --text: #141a24; --muted: #606b7d; --accent: #2f6bff;
      --accent-weak: #e7eeff; --line: #e4e8ef; --line-soft: #eef1f6; --shadow: 0 1px 2px rgba(20,26,36,.06), 0 6px 20px rgba(20,26,36,.05);
      --ok: #167c3b; --ok-bg: #e4f6ea; --warn: #9a6b00; --warn-bg: #fdf1d6; --danger: #c02626; --danger-bg: #fdecec;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
      --bg: #0e131b; --card: #161d28; --text: #e8edf5; --muted: #98a3b5; --accent: #6b9bff;
      --accent-weak: #1b2740; --line: #26303f; --line-soft: #1c2430; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --ok: #5fd389; --ok-bg: #16311f; --warn: #e0b24b; --warn-bg: #332a12; --danger: #ff8b8b; --danger-bg: #351a1a;
    }}
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    header { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; justify-content: space-between;
             align-items: center; gap: 6px 16px; padding: 10px 20px; background: color-mix(in srgb, var(--card) 85%, transparent);
             backdrop-filter: saturate(1.3) blur(8px); border-bottom: 1px solid var(--line); }
    nav .button.secondary { padding: 6px 12px; margin-left: 6px; }
    header .brand { font-weight: 700; letter-spacing: -.02em; font-size: 17px; display: inline-flex; align-items: center; gap: 8px; }
    header .brand::before { content: ""; width: 20px; height: 20px; border-radius: 6px;
                            background: linear-gradient(135deg, var(--accent), #7aa2ff); display: inline-block; }
    nav { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
    nav a { color: var(--muted); text-decoration: none; padding: 7px 11px; border-radius: 8px; font-weight: 500; }
    nav a:hover { color: var(--text); background: var(--line-soft); }
    main { max-width: 880px; margin: 26px auto 64px; padding: 0 20px; }
    h1 { font-size: 24px; letter-spacing: -.02em; margin: 0 0 14px; }
    h2 { font-size: 18px; letter-spacing: -.01em; margin: 0 0 12px; }
    h3 { font-size: 15px; margin: 18px 0 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 16px; }
    .muted { color: var(--muted); }
    .button { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 9px; border: 1px solid transparent;
              cursor: pointer; background: var(--accent); color: #fff; text-decoration: none; font: inherit; font-weight: 600;
              transition: filter .12s, background .12s; }
    .button:hover { filter: brightness(1.07); }
    .button.secondary { background: transparent; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .button.secondary:hover { background: var(--accent-weak); filter: none; }
    table { width: 100%; border-collapse: collapse; margin: 4px 0; }
    th { text-align: left; padding: 9px 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .04em;
         color: var(--muted); border-bottom: 1px solid var(--line); font-weight: 600; }
    td { text-align: left; padding: 11px 10px; border-bottom: 1px solid var(--line-soft); }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover td { background: var(--line-soft); }
    form.inline { display: inline; margin: 0; }
    .notice { max-width: 880px; margin: 16px auto -6px; padding: 11px 16px; border-radius: 10px;
              background: var(--accent-weak); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); color: var(--text); }
    .error { color: var(--danger); }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--line-soft); color: var(--muted);
           font-size: 12.5px; font-weight: 600; vertical-align: middle; }
    .tag.ok { background: var(--ok-bg); color: var(--ok); }
    .tag.warn { background: var(--warn-bg); color: var(--warn); }
    .tag.danger { background: var(--danger-bg); color: var(--danger); }
    .added { color: var(--ok); } .removed { color: var(--danger); text-decoration: line-through; }
    label { display: block; margin: 14px 0 5px; font-weight: 600; font-size: 14px; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font: inherit;
      background: var(--card); color: var(--text); transition: border-color .12s, box-shadow .12s; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
    textarea { min-height: 96px; resize: vertical; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
    pre { white-space: pre-wrap; word-break: break-word; background: var(--line-soft); padding: 10px 12px;
          border-radius: 9px; font-size: 13px; border: 1px solid var(--line); }
    code { background: var(--line-soft); padding: 1px 6px; border-radius: 6px; font-size: .92em; }
  </style>
</head>
<body>
  <header>
    <span class="brand">MetaBrain</span>
    {% if csrf_token %}
    <nav>
      <a href="/">Сотрудники</a>
      <a href="/flows">Сценарии</a>
      <a href="/processes">Процессы</a>
      <a href="/projects">Проекты</a>
      <a href="/proposals">Предложения</a>
      <a href="/skills">Навыки</a>
      <a href="/connections">Подключения</a>
      <a href="/organization">Организация</a>
      <a href="/settings">Настройки</a>
      <a href="/journal">Журнал</a>
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="button secondary" type="submit">Выйти</button>
      </form>
    </nav>
    {% endif %}
  </header>
  {% if notice %}<div class="notice">{{ notice }}</div>{% endif %}
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
